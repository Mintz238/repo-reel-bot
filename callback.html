<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repo Reel bot · TikTok callback</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:560px;margin:80px auto;padding:0 20px;color:#222;text-align:left}code{background:#f3f3f3;padding:2px 6px;border-radius:4px}</style>
</head>
<body>
<h1>Đang kết nối TikTok…</h1>
<p id="msg">Đang chuyển mã đăng nhập về bot trong mạng nhà.</p>
<script>
// TikTok redirects here (public https page). We forward code+state to the bot's LAN dashboard,
// which exchanges the code for tokens immediately. Nothing is stored on this page.
const q = new URLSearchParams(location.search);
const BOT = "http://192.168.1.20:8791/tiktok/callback";
if (q.get("error")) {
  document.getElementById("msg").textContent = "TikTok báo lỗi: " + (q.get("error_description") || q.get("error"));
} else if (q.get("code")) {
  location.replace(BOT + "?" + new URLSearchParams({code: q.get("code"), state: q.get("state") || ""}).toString());
} else {
  document.getElementById("msg").textContent = "Trang này chỉ dùng cho bước đăng nhập TikTok của Repo Reel bot.";
}
</script>
<noscript>Hãy bật JavaScript để hoàn tất kết nối.</noscript>
</body>
</html>
